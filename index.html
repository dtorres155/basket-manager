<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#e8590c">
<title>Basket Manager 2026-27</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Doto:wght@400..900&family=Graduate&display=swap" rel="stylesheet">
<style>
/* Basket Manager — «La camiseta»: la interfaz se viste con los colores del club.
   Tipografías: Graduate (rotulación de camiseta), Bricolage Grotesque (texto), Doto (marcador de puntos). */
:root{
  --club:#e8590c;--club-ink:#101c2e;--club2:#1c2b3a;--club-hi:#e8590c;
  --bg:#e3e7ea;--bg2:#f8f9fa;--bg3:#d4dbe0;--linea:#b4bec6;--tinta:#101c2e;--mut:#56646f;
  --ok:#1f8f5f;--mal:#c8402f;--amb:#b87c00;--led:#ffb000;
  --fd:'Graduate','Rockwell','Arial Narrow',serif;--fb:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--fl:'Doto','Courier New',monospace;
}
:root[data-tema="noche"]{
  --bg:#13181c;--bg2:#1d252b;--bg3:#2a343b;--linea:#3b4750;--tinta:#eef2f4;--mut:#98a6b0;
  --ok:#4cc38a;--mal:#ef6a58;--amb:#e8b84a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tinta);font-family:var(--fb);font-size:15px;line-height:1.4;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
h1,h2,h3,h4{font-family:var(--fd);font-weight:400;margin:0;letter-spacing:.03em}
h3{font-size:22px;line-height:1.1}h4{font-size:15px;color:var(--mut);margin:14px 0 6px}
p{margin:6px 0}.muted{color:var(--mut);font-size:13px}.neg{color:var(--mal)}.pos-v{color:var(--ok)}
:focus-visible{outline:3px solid var(--club);outline-offset:2px}
.app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg);position:relative}

/* Cabecera: cuello de camiseta con ribetes */
.cab{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--club);color:var(--club-ink);margin-bottom:9px;
  background-image:radial-gradient(circle at 96% 135%,transparent 0 44px,rgba(255,255,255,.22) 45px 47px,transparent 48px 66px,rgba(255,255,255,.14) 67px 69px,transparent 70px)}
.cab::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:9px;background:linear-gradient(to bottom,var(--club2) 0 4px,var(--bg) 4px 6px,var(--club2) 6px 9px);pointer-events:none}
.cab-t{flex:1;min-width:0;display:flex;flex-direction:column}.cab-t b{font:400 21px/1.05 var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cab-t span{font-size:12px;opacity:.85}
.cab-c{text-align:right;display:flex;flex-direction:column}.cab-c b{font:400 19px/1 var(--fd)}.cab-c span{font-size:11px;opacity:.85}
.cab .neg{color:inherit;text-decoration:underline wavy}
.btn-ic{width:40px;height:40px;border-radius:10px;background:rgba(0,0,0,.18);color:inherit;display:grid;place-items:center}
.cuerpo{flex:1;overflow-y:auto;padding:12px 12px 20px;-webkit-overflow-scrolling:touch}

/* Navegación */
.nav{display:flex;background:var(--bg2);border-top:4px solid var(--club);padding:3px 2px calc(3px + env(safe-area-inset-bottom,0px))}
.navb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;margin:0 1px;border-radius:10px;color:var(--mut);font-size:10.5px;font-weight:600;text-align:center}
.navb.on{background:var(--club);color:var(--club-ink)}.ic{display:inline-flex}

/* Secciones: banderines */
.sec{margin:0 0 18px}
.sec>h2{display:inline-block;font-size:16px;line-height:1;padding:8px 28px 8px 12px;margin:0 0 10px;background:var(--club);color:var(--club-ink);clip-path:polygon(0 0,100% 0,calc(100% - 13px) 50%,100% 100%,0 100%)}
.tarjeta,.resumen{position:relative;overflow:hidden;background:var(--bg2);border-radius:6px;padding:16px 12px 12px;margin-bottom:9px;box-shadow:0 1px 0 var(--linea)}
.tarjeta::before,.resumen::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(to bottom,var(--club) 0 3px,var(--bg2) 3px 4px,var(--club2) 4px 7px)}

/* Listas: hojas de plantilla con puntos */
.lista{display:flex;flex-direction:column}
.item,.jug,.liga,.club{display:flex;align-items:center;gap:10px;width:100%;padding:10px 4px;background:transparent;border:0;border-bottom:1px dashed var(--linea);border-radius:0}
.lista>.item:last-child,.lista>.jug:last-child{border-bottom:0}
.item.col{flex-direction:column;align-items:stretch;gap:4px}.item .f{width:46px;flex:none}
.ct{flex:1;min-width:0;display:flex;flex-direction:column}.ct b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jug.lesion{background:linear-gradient(90deg,rgba(200,64,47,.14),transparent 70%)}.jug.sel{background:linear-gradient(90deg,color-mix(in srgb,var(--club) 22%,transparent),transparent 80%)}
.pos{width:32px;flex:none;text-align:center;font:400 14px var(--fd);color:var(--mut)}
.fila{display:flex;justify-content:space-between;align-items:center;gap:8px}
.par{display:flex;gap:8px}.par>.btn{flex:1}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:8px 16px;border-radius:9px;background:var(--club);color:var(--club-ink);font-weight:700;font-size:15.5px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn.grande{min-height:54px;font-size:18px;width:100%}.btn.peq{min-height:34px;padding:4px 11px;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn-sec{background:transparent;color:var(--tinta);border:2px solid var(--tinta);box-shadow:none}.btn-sec:active{box-shadow:none}
.btn.peligro{background:transparent;color:var(--mal);border-color:var(--mal)}
.btn[disabled]{opacity:.4}

/* Escudos y dorsales */
.escudo{flex:none;width:34px;height:34px;border-radius:7px 7px 17px 17px;display:grid;place-items:center;font:400 12px var(--fd);border:2px solid rgba(0,0,0,.35)}.escudo.grande{width:60px;height:60px;font-size:19px}
.ovr{flex:none;min-width:40px;text-align:center;padding:3px 6px 6px;border-radius:6px 6px 16px 16px;font:400 18px/1 var(--fd);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}.ovr.grande{font-size:28px;min-width:56px;padding:6px 8px 10px}
.o-a{background:#1f8f5f}.o-b{background:#4f8f2f}.o-c{background:#b87c00}.o-d{background:#667682}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{display:inline-block;padding:3px 10px;border-radius:99px;border:1.5px solid var(--linea);font-size:12.5px;font-weight:500}
.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.mal{border-color:var(--mal);color:var(--mal)}
.barra{display:block;height:8px;border-radius:2px;background:var(--bg3);overflow:hidden;flex:1;min-width:46px}.barra i{display:block;height:100%;background:var(--club)}
.barra.verde i{background:var(--ok)}.barra.ambar i{background:var(--amb)}.barra.rojo i{background:var(--mal)}.energia{width:46px;display:flex}
.aviso{padding:10px 12px;border-radius:4px 10px 10px 4px;background:var(--bg3);border-left:5px solid var(--club);margin:6px 0;font-size:14px}.aviso.med{border-color:var(--amb)}.aviso.mal{border-color:var(--mal)}.aviso.ok{border-color:var(--ok)}

/* Pestañas: subrayado; segmentos: botones redondos */
.tabs{display:flex;gap:2px;overflow-x:auto;margin-bottom:12px;border-bottom:2px solid var(--linea)}
.tabs .tab{flex:1 0 auto;padding:9px 12px 7px;border:0;border-bottom:4px solid transparent;border-radius:0;margin-bottom:-2px;background:none;color:var(--mut);font-weight:600;text-align:center;white-space:nowrap}
.tabs .tab.on{color:var(--tinta);border-bottom-color:var(--club)}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;flex-wrap:wrap}.seg.compacto{flex-wrap:nowrap}
.seg .tab{flex:1 0 auto;padding:7px 13px;border-radius:99px;border:2px solid var(--linea);font-size:14px;font-weight:600;text-align:center;white-space:nowrap}
.seg .tab.on{background:var(--club);color:var(--club-ink);border-color:var(--club)}

/* Tablas */
.tabla{width:100%;border-collapse:collapse;font-size:13px;background:var(--bg2);border-radius:6px;overflow:hidden}.tabla th{color:var(--mut);font-weight:600;padding:7px 4px;text-align:center;border-bottom:2px solid var(--club)}
.tabla td{padding:6px 4px;text-align:center;border-top:1px dashed var(--linea)}.tabla .iz{text-align:left}.tabla .escudo{width:20px;height:20px;font-size:0;border-radius:4px 4px 10px 10px;vertical-align:middle;border-width:1.5px}
.tabla tr.mio td{background:color-mix(in srgb,var(--club) 22%,transparent);font-weight:700}.tabla .b{font-weight:700}.tabla.pq td,.tabla.pq th{padding:4px 3px}

/* Partido: entrada con muescas y marcador de puntos */
.tarjeta.partido{padding-top:18px;background:radial-gradient(circle at 0 62%,var(--bg) 10px,transparent 11px) left/51% 100% no-repeat,radial-gradient(circle at 100% 62%,var(--bg) 10px,transparent 11px) right/51% 100% no-repeat,var(--bg2)}
.partido .etq,.resultado .etq{font:400 15px var(--fd);text-align:center;color:var(--tinta)}
.marcador{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0}.vs{font:400 22px var(--fd);color:var(--mut)}
.nombres{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:6px}
.duelo{display:flex;align-items:center;gap:8px;font:400 17px var(--fd)}.barra.dual{height:10px;background:var(--bg3)}.barra.dual i{background:var(--club)}
.pts{display:flex;align-items:baseline;gap:12px;padding:6px 16px 4px;border-radius:8px;background:#0b0e11;box-shadow:inset 0 0 0 3px var(--club2),0 0 0 2px var(--tinta);font-family:var(--fl);color:var(--led);text-shadow:0 0 9px rgba(255,176,0,.55)}
.pts b{font-size:46px;font-weight:800;line-height:1}.pts i{font-style:normal;color:#7a6326}
.resultado.gana .pts{color:#5fe0a4;text-shadow:0 0 9px rgba(95,224,164,.5)}.resultado.pierde .pts{color:#ff7d6b;text-shadow:0 0 9px rgba(255,125,107,.5)}
.wl{flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font:400 14px var(--fd);color:#fff}.wl.w{background:var(--ok)}.wl.l{background:var(--mal)}
.item.res,.item.serie{cursor:pointer}.serie{justify-content:center;font:400 20px var(--fd)}
.cronica{margin:0;padding-left:18px;font-size:14px}.cronica li{margin:4px 0}.top .fila{font-size:13px;padding:2px 0}

/* Voces: citas de quien propone o pide */
.cita{display:flex;gap:10px;margin:8px 0;padding:10px;background:var(--bg3);border-radius:10px}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;background:var(--club);color:var(--club-ink);font:400 18px/38px var(--fd);text-align:center}
.cita .rol{font-size:12px;color:var(--mut)}.cita .dicho{margin:4px 0 0;font-style:italic}

/* Hojas modales y avisos */
.fondo{position:fixed;inset:0;background:rgba(5,10,20,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.hoja{width:100%;max-width:560px;max-height:86dvh;overflow-y:auto;background:var(--bg2);color:var(--tinta);border-radius:18px 18px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:6px solid var(--club);animation:sube .2s ease-out}
.hoja.alta{max-height:92dvh}.asa{width:44px;height:5px;border-radius:3px;background:var(--linea);margin:4px auto 10px}.acciones{display:flex;flex-direction:column;gap:8px;margin-top:14px}
@keyframes sube{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--tinta);color:var(--bg2);padding:10px 16px;border-radius:8px;border-left:6px solid var(--club);font-weight:600;z-index:99;transition:opacity .3s;max-width:90vw}.toast.fuera{opacity:0}
.attrs{margin-top:10px}.at{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.at span{width:112px;color:var(--mut)}.at b{width:26px;text-align:right}
.ajuste{margin:10px 0}.ajuste b{display:block;margin-bottom:5px;font-size:13px;color:var(--mut)}
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.sel,.area{width:100%;padding:9px 10px;border-radius:8px;background:var(--bg2);border:2px solid var(--linea);color:var(--tinta);font:inherit}.area{resize:vertical}
.resumen{display:flex;flex-direction:column;gap:4px}.gran{font:400 30px/1.1 var(--fd);display:block}.rango{width:100%;accent-color:var(--club);margin:10px 0}
.medidor{margin:10px 0;display:flex;flex-direction:column;gap:4px}

/* Menú de inicio */
.menu{padding:calc(20px + env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;height:100%}.menu .col,.col{display:flex;flex-direction:column;gap:10px;margin-top:14px}.pie{margin-top:18px}
.portada{position:relative;margin:-20px -16px 8px;padding:calc(34px + env(safe-area-inset-top,0px)) 20px 34px;background:var(--club);color:var(--club-ink);overflow:hidden}
.portada::before{content:"";position:absolute;right:-60px;top:-30px;width:230px;height:230px;border-radius:50%;border:5px solid rgba(255,255,255,.28);box-shadow:inset 0 0 0 38px transparent,0 0 0 26px rgba(255,255,255,.12)}
.portada::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(to bottom,var(--club2) 0 4px,var(--bg) 4px 6px,var(--club2) 6px 9px)}
.portada h1{position:relative;font-size:46px;line-height:.98;letter-spacing:.02em}.portada p{position:relative;margin:10px 0 0;max-width:20em;opacity:.92}
.liga{flex-direction:column;align-items:flex-start;gap:2px;padding:14px 12px;font-size:17px;border:2px solid var(--tinta);border-radius:10px;background:var(--bg2)}.liga b{font:400 22px var(--fd)}
.club{border-bottom:1px dashed var(--linea)}.club .ct b{font-size:15px}.cargando{display:grid;place-items:center;height:100%;font:400 24px var(--fd);color:var(--club-hi)}

/* Vistas 3D */
.c3d{display:flex;flex-direction:column;gap:10px}.vista3d{height:300px;border-radius:8px;overflow:hidden;background:#a9d6f2;position:relative;border:3px solid var(--tinta)}.vacio{padding:24px;color:#10202f;font-size:14px}.panel3d{display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){.hoja{animation:none}.toast{transition:none}}

/* Personaje y carrera */
.avatar-pj{display:inline-flex;flex:none;border-radius:50%;overflow:hidden;line-height:0}
.avatar-btn{padding:0;overflow:hidden;background:transparent!important}
.centro{display:flex;justify-content:center;margin:6px 0 10px}
.perfil-linea{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;margin-bottom:12px;background:var(--bg2);border-radius:10px;border-left:6px solid var(--club)}
.ficha .gran{font-size:24px}
.escalera{display:flex;flex-direction:column;gap:6px}
.peldano{display:flex;flex-direction:column;padding:9px 12px;border-radius:8px;border:2px dashed var(--linea);color:var(--mut)}
.peldano:nth-child(1){margin-left:0}.peldano:nth-child(2){margin-left:14px}.peldano:nth-child(3){margin-left:28px}.peldano:nth-child(4){margin-left:42px}
.peldano.sup{border-style:solid;border-color:var(--club);color:var(--tinta)}
.peldano.act{border:3px solid var(--club);background:color-mix(in srgb,var(--club) 18%,transparent);color:var(--tinta)}

.item.col .barra{margin-top:2px}

/* Partido en directo */
.directo{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;background:#0c1116;color:#eef2f4;max-width:560px;margin:0 auto;overflow-y:auto}
.dir-marcador{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px;background:#0b0e11;border-bottom:4px solid var(--club)}
.dir-eq{display:flex;flex-direction:column}.dir-eq b{font:400 22px var(--fd)}.dir-eq.der{text-align:right}.dir-eq .muted{font-size:11px;color:#8fa0ab}
.dir-num{display:flex;align-items:baseline;gap:8px;font-family:var(--fl);color:var(--led);text-shadow:0 0 9px rgba(255,176,0,.55)}.dir-num b{font-size:40px;font-weight:800}.dir-num i{font-style:normal;color:#7a6326}
.dir-reloj{grid-column:1/-1;text-align:center;font:400 14px var(--fd);color:#8fa0ab}
.dir-vista{height:260px;flex:none;background:#10151b;position:relative}
.dir-ticker{display:flex;flex-direction:column;gap:3px;padding:8px 12px;min-height:96px;background:#10161d;font-size:13.5px}.dir-linea{opacity:.9}.dir-linea.bien{color:#5fe0a4;font-weight:600}
.dir-ctrl{padding:10px 12px}.dir-panel{padding:0 12px 24px}.dir-panel .jug,.dir-panel .tab{color:#eef2f4}.dir-panel .tab.on{color:var(--club-ink)}
</style></head>
<body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
try{
/* ===== core ===== */
/* NÚCLEO · Basket Manager 26/27
   Expone window.GM: rng, bus de eventos, utilidades, addData, newGame.
   Lee/crea la raíz de GM.state (ver contrato). */
window.GM = window.GM || (function () {
  let s = 123456789;
  const handlers = {};
  const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const util = {
    clamp(v, a, b) { return v < a ? a : v > b ? b : v; },
    hash(str) { let h = 2166136261; str = String(str); for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; },
    addDays(iso, n) { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); },
    diffDays(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); },
    weekday(iso) { return new Date(iso + 'T00:00:00Z').getUTCDay(); },
    eur(n) {
      n = Math.round(n); const a = Math.abs(n), sg = n < 0 ? '-' : '';
      if (a >= 1e6) return sg + (a / 1e6).toFixed(a >= 1e8 ? 0 : 1).replace('.', ',') + ' M€';
      if (a >= 1e3) return sg + Math.round(a / 1e3) + ' k€';
      return sg + a + ' €';
    },
    fecha(iso) { const d = new Date(iso + 'T00:00:00Z'); return DIAS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MESES[d.getUTCMonth()]; },
    fechaLarga(iso) { const d = new Date(iso + 'T00:00:00Z'); return DIAS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MESES[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); },
    clone(o) { return JSON.parse(JSON.stringify(o)); }
  };
  const GM = {
    data: { equipos: {}, jugadores: {}, ligas: {} },
    mods: {},
    ui: { screens: {} },
    state: null,
    util,
    rng: {
      seed(n) { s = (n >>> 0) || 1; },
      next() { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; },
      int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); },
      pick(arr) { return arr[this.int(0, arr.length - 1)]; },
      range(a, b) { return a + this.next() * (b - a); },
      chance(p) { return this.next() < p; },
      normal() { let u = 0; for (let i = 0; i < 6; i++) u += this.next(); return (u - 3) / 0.7071; }
    },
    bus: {
      on(e, f) { (handlers[e] = handlers[e] || []).push(f); },
      emit(e, p) { (handlers[e] || []).slice().forEach(f => f(p)); }
    },
    register(nombre, mod) { this.mods[nombre] = mod; return mod; },
    addData(p) {
      (p.ligas || []).forEach(l => { this.data.ligas[l.id] = l; });
      (p.equipos || []).forEach(e => { this.data.equipos[e.id] = Object.assign({ plantilla: [] }, e); });
      (p.jugadores || []).forEach(j => {
        this.data.jugadores[j.id] = j;
        const e = this.data.equipos[j.equipoId];
        if (e && !e.plantilla.includes(j.id)) e.plantilla.push(j.id);
      });
    },
    noticia(state, texto) {

  // fila: [nombre,pos,edad,ovr,pot,perfil,salarioM,hasta,nac?]
  GM.club = function (def, filas, opt) {
    opt = opt || {};
    const mult = opt.usd ? 0.92 : 1;
    const eq = {
      id: def[0], nombre: def[1], siglas: def[2], ciudad: def[3], pais: def[4], colores: def[5], reputacion: def[6],

    });
    const objetivo = opt.plantilla || 13;
    const minOvr = js.length ? Math.min.apply(null, js.map(j => j.ovr)) : (opt.baseOvr || 58);
    const cnt = { PG: 0, SG: 0, SF: 0, PF: 0, C: 0 };
    js.forEach(j => cnt[j.pos]++);
    const pais = opt.paisRelleno || def[4];
    const salMin = opt.salMin || (opt.usd ? 2.2 : 0.15);
    const salStep = opt.salStep || (opt.usd ? 0.12 : 0.03);
    const nReal = js.length;
    while (js.length < objetivo) {
      const pos = ['PG', 'SG', 'SF', 'PF', 'C'].sort((a, b) => cnt[a] - cnt[b])[0];
      cnt[pos]++;
      const h = GM.util.hash(eq.id + '#' + js.length);
      const k = js.length - nReal;
      const ovr = Math.max(44, (nReal ? minOvr - 2 : minOvr + 3) - (h % 5) - Math.floor(k / 4) * 2);
      const edad = 19 + (h >>> 3) % 15;
      const sal = Math.round((salMin + Math.max(0, ovr - 55) * salStep) * 1e6);

      j.ficticio = true;
      js.push(j);

    js.forEach(j => GM._pack.jugadores.push(j));
    return eq;
  };

    (ligas || []).forEach(l => GM._pack.ligas.push(l));

  };
})();

    const esc = escala(g.comp), m = M();
    const aforo = m.estadio && m.estadio.aforo ? m.estadio.aforo(st, g.local) : eq.pabellon.aforo;
    const ciu = m.ciudad ? m.ciudad.modificadores(st, g.local) : { asistencia: 1, ingresos: 1 };
    const efe = m.estadio && m.estadio.efectos ? m.estadio.efectos(st, g.local) : { precio: 1, merch: 1, asistencia: 1 };
    const cl = st.ciudad[g.local] || { ambiente: 50, aficion: 50 };
    let fr = 0.40 + 0.22 * eq.reputacion / 100 + 0.14 * cl.ambiente / 100 + 0.08 * cl.aficion / 100 + 0.10 * rival.reputacion / 100;

/* ===== directiva_ia ===== */
/* DIRECTIVA IA (GM.mods.directiva) — solo en modo Presidente
   El director deportivo propone fichajes y renovaciones, el entrenador gestiona alineación y cantera. El presidente puede vetar
   (cuesta influencia), aprobar al instante, cambiar al entrenador o impulsar una obra.
   Expone: estado, pendientes, vetar, aprobar, cambiarEntrenador, impulsarObra, selfTest.
   Escribe state.directiva = { entrenador, director, propuestas, registro }. */
(function () {
  const U = GM.util;
  const yearOf = st => parseInt(st.temporada.slice(0, 4), 10);
  const PERFILES = { cantera: 'Apuesta por la cantera', estrellas: 'Busca estrellas', ganar_ya: 'Quiere ganar ya', equilibrado: 'Equilibrado' };
  const act = st => !!st && st.modo === 'presidente' && !!st.directiva;
  const M = () => GM.mods.mercado;

  function persona(st, perfil, sal) {
    const h = U.hash(st.clubId + st.fecha + sal + GM.rng.int(0, 9999));
    return { nombre: GM.nombreAleatorio(st.equipos[st.clubId].pais || 'ES', h), perfil: perfil || GM.rng.pick(Object.keys(PERFILES)) };
  }
  function puntuacion(p, perfil) {
    const edad = p.edad;
    if (perfil === 'cantera') return p.pot * 0.6 + p.ovr * 0.4 - Math.max(0, edad - 26) * 1.5;
    if (perfil === 'estrellas') return p.ovr * 1.1 + (edad < 31 ? 2 : 0) + (p.pot > 80 ? 2 : 0);
    if (perfil === 'ganar_ya') return p.ovr - Math.max(0, edad - 34) * 0.5;
    return p.ovr * 0.7 + p.pot * 0.3;
  }
  const mia = st => st.equipos[st.clubId].plantilla.map(i => st.jugadores[i]).filter(Boolean);
  function ligaPrincipal(st) { return M().ligaDe(st, st.clubId); }

  const POSN = { PG: 'base', SG: 'escolta', SF: 'alero', PF: 'ala-pívot', C: 'pívot' };
  function cita(st, p, perfil, falta) {
    const pos = POSN[p.pos], e = p.edad, base = {
      cantera: ['Tiene ' + e + ' años y mucho que crecer. Encaja con lo que somos.', 'Un ' + pos + ' joven que puede ser de los nuestros durante años.'],
      estrellas: ['Es un nombre que llena el pabellón. Cada euro está bien invertido.', 'Un ' + pos + ' con carácter de estrella. La grada lo va a querer.'],
      ganar_ya: ['Hoy nos hace mejores. Del mañana ya hablaremos.', 'Nos falta un ' + pos + ' que decida partidos. Este lo hace.'],
      equilibrado: ['Cubre una necesidad real sin disparar la masa salarial.', 'Un ' + pos + ' fiable. No es un fichaje de portada, es un fichaje que sirve.']
    }[perfil];
    return (falta ? 'Estamos cortos de plantilla. ' : '') + base[GM.rng.int(0, 1)];
  }
  function proponer(st) {
    const d = st.directiva, perfil = d.director.perfil, club = st.clubId;
    if (d.propuestas.some(p => p.estado === 'pendiente' && p.tipo === 'fichaje')) return;
    const pl = mia(st).sort((a, b) => puntuacion(b, perfil) - puntuacion(a, perfil));
    const falta = pl.length < 13;
    const referencia = pl[Math.min(pl.length - 1, 8)];
    if (!falta && (!referencia || GM.rng.next() > 0.3 || pl.length >= 15)) return;
    const l = ligaPrincipal(st);
    let c = null, mejor = -1;
    M().libres(st).slice(0, 40).forEach(p => {
      if (p.origen === 'NBA' && l !== 'NBA' && p.ovr > 72) return;
      const sc = puntuacion(p, perfil);
      if (!falta && sc < puntuacion(referencia, perfil) + 2) return;
      const ask = M().salarioPedido(st, p.id, club);
      const tp = M().topeSalarial(st, club);
      if (l === 'NBA' ? (tp.masa + ask > 140e6 && ask > 2.3e6) : tp.masa + ask > tp.tope) return;
      if (sc > mejor) { mejor = sc; c = { p, ask }; }
    });
    if (!c) return;
    d.propuestas.push({ cita: cita(st, c.p, perfil, falta), id: 'p' + (d.seq = (d.seq || 0) + 1), tipo: 'fichaje', jugadorId: c.p.id, salario: Math.round(c.ask * 1.05 / 10000) * 10000, anos: c.p.edad <= 26 ? 3 : c.p.edad <= 30 ? 2 : 1, fecha: st.fecha, ejecutaEn: U.addDays(st.fecha, 3), estado: 'pendiente' });
    GM.noticia(st, 'La directiva quiere fichar a ' + c.p.nombre + ' (' + c.p.ovr + '). Tienes 3 días para vetarlo.');
  }
  function ejecutar(st, p) {
    const d = st.directiva, jug = st.jugadores[p.jugadorId];
    if (!jug || !jug.libre) { p.estado = 'fallido'; return; }
    const r = M().ofertar(st, p.jugadorId, { salario: p.salario, anos: p.anos });
    p.estado = r.ok ? 'hecho' : 'fallido'; p.motivo = r.motivo || null;
    d.registro.unshift({ fecha: st.fecha, texto: (r.ok ? 'Ficha a ' : 'No consigue fichar a ') + jug.nombre + '.' }); if (d.registro.length > 30) d.registro.length = 30;
    if (r.ok && GM.mods.legado && GM.mods.legado.ajustar) {
      const top = mia(st).sort((a, b) => b.ovr - a.ovr).slice(0, 3).some(x => x.id === jug.id);
      if (top) GM.mods.legado.ajustar(st, { ambicion: 1 }, 0); else if (jug.edad <= 23) GM.mods.legado.ajustar(st, { cantera: 1 }, 0);
    }
  }
  function vetar(st, id) {
    const p = st.directiva.propuestas.find(x => x.id === id && x.estado === 'pendiente');
    if (!p) return { ok: false, motivo: 'La propuesta ya no está pendiente.' };
    const g = GM.mods.legado.gastar(st, 15, 'veto'); if (!g.ok) return g;
    p.estado = 'vetada'; const dr = st.directiva.director; GM.noticia(st, 'Vetas el fichaje de ' + st.jugadores[p.jugadorId].nombre + '. ' + dr.nombre + ' acepta, pero ' + ({ cantera: 'insiste en que hay que mirar más a la cantera.', estrellas: 'no esconde su malestar: «Perdemos una oportunidad».', ganar_ya: 'recuerda que el calendario no espera.', equilibrado: 'lo respeta y buscará otra opción.' })[dr.perfil]);
    if (GM.mods.legado.ajustar) GM.mods.legado.ajustar(st, {}, -0.5);
    return { ok: true };
  }
  function aprobar(st, id) {
    const p = st.directiva.propuestas.find(x => x.id === id && x.estado === 'pendiente');
    if (!p) return { ok: false, motivo: 'La propuesta ya no está pendiente.' };
    ejecutar(st, p); return { ok: p.estado === 'hecho', motivo: p.motivo };
  }
  function cambiarEntrenador(st) {
    const g = GM.mods.legado.gastar(st, 40, 'entrenador'); if (!g.ok) return g;
    const ant = st.directiva.entrenador;
    st.directiva.entrenador = persona(st, GM.rng.pick(Object.keys(PERFILES).filter(k => k !== ant.perfil)), 'e');
    GM.noticia(st, 'Cambio en el banquillo: llega ' + st.directiva.entrenador.nombre + ' (' + PERFILES[st.directiva.entrenador.perfil].toLowerCase() + ').');
    return { ok: true };
  }
  function impulsarObra(st, tipo, ref) {
    const inst = st.instalaciones[st.clubId];
    let o = null;
    if (tipo === 'cd') { const b = inst.ciudadDeportiva.edificios.find(x => x.slot === ref && x.obra); o = b && b.obra; }
    else o = inst.pabellon.obras.find(x => x.id === ref);
    if (!o) return { ok: false, motivo: 'No hay obra en marcha.' };
    const resta = U.diffDays(st.fecha, o.fin); if (resta <= 3) return { ok: false, motivo: 'La obra está casi terminada.' };
    const g = GM.mods.legado.gastar(st, 25, 'obra'); if (!g.ok) return g;
    o.fin = U.addDays(st.fecha, Math.max(2, Math.ceil(resta * 0.6)));
    GM.noticia(st, 'Aceleras la obra con tus contactos en el ayuntamiento.');
    return { ok: true };
  }

  GM.bus.on('dia:avanzado', function () {
    const st = GM.state; if (!act(st)) return;
    const d = st.directiva, club = st.clubId, eq = st.equipos[club];
    eq.tactica = null;
    d.propuestas.filter(p => p.estado === 'pendiente' && p.ejecutaEn <= st.fecha).forEach(p => ejecutar(st, p));
    d.propuestas = d.propuestas.filter(p => p.estado === 'pendiente' || U.diffDays(p.fecha, st.fecha) < 20);
    if (U.weekday(st.fecha) !== 1) return;
    proponer(st);
    if (GM.rng.next() < 0.3) {
      const ult = GM.mods.competiciones.calendarioClub(st, club).filter(g => g.resultado).slice(-1)[0], en = d.entrenador;
      if (ult) {
        const local = ult.local === club, gano = (ult.resultado.local > ult.resultado.visitante) === local;
        const F = { cantera: gano ? ['«Los chicos han dado la cara. Así se construye un equipo.»'] : ['«Hemos perdido, pero he visto cosas buenas en los jóvenes.»'], estrellas: gano ? ['«Cuando nuestras figuras aparecen, somos difíciles de parar.»'] : ['«Nos faltó que las estrellas decidieran.»'], ganar_ya: gano ? ['«Victoria. Ahora, la siguiente.»'] : ['«No me vale. Hay que exigirse más.»'], equilibrado: gano ? ['«Buen trabajo colectivo. Sin euforias.»'] : ['«Toca analizar y corregir. Nada más.»'] }[en.perfil];
        GM.noticia(st, en.nombre + ' (entrenador): ' + F[0]);
      }
    }
    // cantera: el entrenador sube a quien lo merece
    const C = GM.mods.cantera;
    if (C && st.cantera[club] && eq.plantilla.length < 14) {
      const per = d.entrenador.perfil;
      const j = st.cantera[club].juveniles.map(i => st.jugadores[i]).filter(p => p && (p.ovr >= 52 && p.pot >= 72 || per === 'cantera' && p.ovr >= 48 && p.pot >= 70)).sort((a, b) => b.pot - a.pot)[0];
      if (j) { const r = C.subirAlPrimerEquipo(st, j.id); if (r.ok) d.registro.unshift({ fecha: st.fecha, texto: 'El entrenador sube a ' + j.nombre + ' desde la cantera.' }); }
    }
    // plantilla sobrante
    if (eq.plantilla.length > 14) {
      const peor = mia(st).sort((a, b) => a.ovr - b.ovr)[0];
      const of = M().ofertasVenta(st, peor.id)[0];
      const r = of ? M().vender(st, peor.id, of.equipoId) : M().liberar(st, peor.id);
      if (r.ok) d.registro.unshift({ fecha: st.fecha, texto: (of ? 'Traspasa a ' : 'Libera a ') + peor.nombre + '.' });
    }
  });
  GM.bus.on('temporada:fin', function () {
    const st = GM.state; if (!act(st)) return;
    const d = st.directiva, perfil = d.director.perfil;
    const fin = yearOf(st) + 1, exp = M().expiran(st, st.clubId).sort((a, b) => puntuacion(b, perfil) - puntuacion(a, perfil));
    const total = mia(st).length; let renov = 0;
    exp.forEach((p, i) => {
      const util = i < 6 || (perfil === 'cantera' && p.edad <= 24 && p.pot >= 68) || p.ovr >= 66;
      if (!util || total - exp.length + renov >= 14) return;
      const ask = Math.round(M().salarioPedido(st, p.id, st.clubId) * 1.06 / 10000) * 10000;
      const r = M().renovar(st, p.id, { salario: ask, anos: p.edad <= 26 ? 3 : p.edad <= 30 ? 2 : 1 });
      if (r.ok) { renov++; d.registro.unshift({ fecha: st.fecha, texto: 'Renueva a ' + p.nombre + '.' }); }
    });
    d.propuestas = d.propuestas.filter(p => p.estado === 'pendiente');
  });

  function nuevaPartida(st) {
    if (st.modo !== 'presidente') return;
    st.directiva = { entrenador: persona(st, null, 'e'), director: persona(st, null, 'd'), propuestas: [], registro: [], seq: 0 };
    st.equipos[st.clubId].tactica = null;
  }
  function estado(st) { return act(st) ? st.directiva : null; }
  function pendientes(st) { return act(st) ? st.directiva.propuestas.filter(p => p.estado === 'pendiente') : []; }
  function selfTest() { return typeof puntuacion === 'function' && puntuacion({ ovr: 60, pot: 80, edad: 20 }, 'cantera') > puntuacion({ ovr: 70, pot: 70, edad: 33 }, 'cantera') - 20 && puntuacion({ ovr: 80, pot: 80, edad: 28 }, 'ganar_ya') > puntuacion({ ovr: 60, pot: 90, edad: 20 }, 'ganar_ya'); }
  GM.register('directiva', { estado, pendientes, vetar, aprobar, cambiarEntrenador, impulsarObra, nuevaPartida, selfTest, PERFILES });
})();

/* ===== guardado ===== */
/* GUARDADO (GM.mods.guardado)
   Expone: guardar, cargar, listar, borrar, exportar, importar, persistente, selfTest.
   Ranuras gm1:slot0 (autoguardado, cada 7 días de juego y al acabar la temporada), slot1 y slot2 (manuales).
   Usa localStorage con try/catch; si no está disponible guarda en memoria (se pierde al cerrar) y avisa. Sin PWA. */
(function () {
  const PFX = 'gm1:slot', META = 'gm1:meta', MAXB = 2.6e6;
  const mem = {};
  let persist = true;
  function alm() {
    try { const s = window.localStorage; s.setItem('gm1:t', '1'); s.removeItem('gm1:t'); return s; }
    catch (e) { persist = false; return { getItem: k => (k in mem ? mem[k] : null), setItem: (k, v) => { mem[k] = String(v); }, removeItem: k => { delete mem[k]; } }; }
  }
  function metas(a) { try { return JSON.parse(a.getItem(META) || '{}'); } catch (e) { return {}; } }
  function guardar(slot) {
    const st = GM.state; if (!st) return { ok: false, motivo: 'No hay partida en curso.' };
    const a = alm(), txt = JSON.stringify(st);
    if (txt.length > MAXB) return { ok: false, motivo: 'La partida pesa demasiado (' + (txt.length / 1e6).toFixed(1) + ' MB). Exporta una copia como texto.' };
    try {
      a.setItem(PFX + slot, txt);
      const m = metas(a); m[slot] = { club: st.equipos[st.clubId].nombre, fecha: st.fecha, temporada: st.temporada, t: Date.now(), mb: +(txt.length / 1e6).toFixed(2) };
      a.setItem(META, JSON.stringify(m));
    } catch (e) { return { ok: false, motivo: 'No hay espacio en el navegador. Borra una ranura o exporta la partida.' }; }
    return { ok: true, persistente: persist };
  }
  function migrar(st) { if (!st.version) st.version = 1; if (!st.estadisticas) st.estadisticas = {}; if (!st.historial) st.historial = []; return st; }
  function cargar(slot) {
    const a = alm(), txt = a.getItem(PFX + slot);
    if (!txt) return { ok: false, motivo: 'La ranura está vacía.' };
    try { GM.state = migrar(JSON.parse(txt)); } catch (e) { return { ok: false, motivo: 'La partida guardada está dañada.' }; }
    GM.bus.emit('partida:cargada', { slot });
    return { ok: true };
  }
  function listar() { const m = metas(alm()); return [0, 1, 2].map(s => Object.assign({ slot: s }, m[s] || null)); }
  function borrar(slot) { const a = alm(); a.removeItem(PFX + slot); const m = metas(a); delete m[slot]; a.setItem(META, JSON.stringify(m)); return { ok: true }; }
  function b64(s) { return btoa(unescape(encodeURIComponent(s))); }
  function unb64(s) { return decodeURIComponent(escape(atob(s))); }
  function exportar() { return GM.state ? 'GM1:' + b64(JSON.stringify(GM.state)) : ''; }
  function importar(texto) {
    try {
      const t = String(texto || '').trim(); if (t.slice(0, 4) !== 'GM1:') return { ok: false, motivo: 'El texto no empieza por GM1:.' };
      const st = JSON.parse(unb64(t.slice(4)));
      if (!st.equipos || !st.jugadores || !st.calendario) return { ok: false, motivo: 'El texto no es una partida válida.' };
      GM.state = migrar(st); GM.bus.emit('partida:cargada', { slot: -1 }); return { ok: true };
    } catch (e) { return { ok: false, motivo: 'No se ha podido leer la partida.' }; }
  }
  GM.bus.on('dia:avanzado', function () {
    const st = GM.state; if (!st || !st.clubId) return;
    if (st.ultimoAuto === undefined || GM.util.diffDays(st.ultimoAuto, st.fecha) >= 7) { st.ultimoAuto = st.fecha; guardar(0); }
  });
  GM.bus.on('temporada:fin', function () { if (GM.state) guardar(0); });
  function selfTest() {
    if (typeof btoa === 'undefined') return true;
    const prev = GM.state;
    GM.state = { version: 1, clubId: 'a', fecha: '2026-10-01', temporada: '2026-27', equipos: { a: { nombre: 'Ñandú' } }, jugadores: { x: { n: 1 } }, calendario: [], estadisticas: {}, historial: [] };
    const j0 = JSON.stringify(GM.state);
    const r = guardar(2); GM.state = null; const c = cargar(2);
    const ok1 = r.ok && c.ok && JSON.stringify(GM.state) === j0;
    const ex = exportar(); GM.state = null; const im = importar(ex);
    const ok2 = im.ok && JSON.stringify(GM.state) === j0;
    borrar(2); GM.state = prev;
    return ok1 && ok2;
  }
  GM.register('guardado', { guardar, cargar, listar, borrar, exportar, importar, persistente: () => persist, selfTest });
})();

/* ===== partidos ===== */
/* MOTOR DE PARTIDOS (GM.mods.partidos)
   Simula por posesiones usando atributos, forma, fatiga y táctica. Expone: ovrEquipo, tacticaAuto, tacticaValida, simular, selfTest.
   Lee state.equipos/jugadores; modifica estado (fatiga, forma, lesión) de los jugadores tras cada partido.
   En dia:avanzado recupera fatiga y días de lesión (usa ciudadDeportiva.efectos si existe). */
(function () {
  const U = GM.util, R = () => GM.rng.next();
  const TIPOS_LESION = ['Esguince de tobillo', 'Sobrecarga muscular', 'Rotura fibrilar', 'Contusión en la rodilla', 'Molestias en la espalda', 'Fractura en un dedo', 'Esguince de rodilla'];

  function cfg(comp) {
    return comp === 'NBA'
      ? { q: 12, pace: 99, p3: 0.40, m3: 0.366, m2: 0.542, ast: 0.62, ha: 0.012 }
      : { q: 10, pace: 73, p3: 0.345, m3: 0.343, m2: 0.506, ast: 0.56, ha: 0.016 };
  }
  const effF = p => (0.75 + 0.25 * p.estado.forma / 100) * (1 - 0.16 * p.estado.fatiga / 100);
  const lesionado = p => p.estado.lesion && p.estado.lesion.dias > 0;
  const esG = pos => pos === 'PG' || pos === 'SG';
  const esB = pos => pos === 'PF' || pos === 'C';

  function plantilla(state, eqId) {
    const ids = state.equipos[eqId].plantilla;
    const todos = ids.map(i => state.jugadores[i]).filter(Boolean);
    const sanos = todos.filter(p => !lesionado(p));
    return sanos.length >= 5 ? sanos : todos.slice().sort((a, b) => (a.estado.lesion ? a.estado.lesion.dias : 0) - (b.estado.lesion ? b.estado.lesion.dias : 0));
  }
  function mejorQuinteto(pl) {
    const s = pl.slice().sort((a, b) => b.ovr - a.ovr);
    const q = s.slice(0, 5);
    const arregla = (cond, minimo) => {
      let n = q.filter(p => cond(p.pos)).length;
      while (n < minimo) {
        const cand = s.find(p => cond(p.pos) && q.indexOf(p) < 0);
        if (!cand) break;
        const out = q.slice().reverse().find(p => !cond(p.pos));
        if (!out) break;
        q[q.indexOf(out)] = cand; n++;
      }
    };
    arregla(esG, 2); arregla(esB, 1);
    return q;
  }
  function ovrEquipo(state, eqId) {
    const w = [1.2, 1.1, 1, 0.95, 0.9, 0.7, 0.6, 0.4];
    const o = plantilla(state, eqId).map(p => p.ovr * effF(p) / 0.95).sort((a, b) => b - a).slice(0, 8);
    let s = 0, t = 0;
    o.forEach((v, i) => { s += v * w[i]; t += w[i]; });
    return t ? Math.round(s / t * 10) / 10 : 0;
  }
  function tacticaAuto(state, eqId) {
    const q = mejorQuinteto(plantilla(state, eqId));
    return { quinteto: q.map(p => p.id), ritmo: 2 + (U.hash(eqId) % 3), defensa: 'hombre', foco: 'equilibrado' };
  }
  function tacticaValida(state, eqId) {
    let t = state.equipos[eqId].tactica;
    const pl = plantilla(state, eqId);
    const ids = pl.map(p => p.id);

  const FRAC = [0.80, 0.78, 0.74, 0.70, 0.66, 0.55, 0.46, 0.36, 0.24, 0.12, 0.05];
  function mkTeam(state, eqId, tac, gmin) {

    const resto = pl.filter(p => start.indexOf(p) < 0).sort((a, b) => b.ovr - a.ovr);
    const lista = start.concat(resto).slice(0, 12);

      p, f: effF(p), played: 0, jit: 0, target: (i < n ? Math.min(0.92, FRAC[i] * sc) : 0.02) * gmin,
      s: { min: 0, pts: 0, reb: 0, ast: 0, stl: 0, blk: 0, tov: 0, fal: 0 }

      let c = L.filter(e => cond(e.p.pos)).length;

        if (!cand) break;

  function agg(L, tac) {
    const a = { L, t3: 0, t2: 0, tl: 0, pase: 0, bote: 0, reb: 0, dI: 0, dP: 0, fis: 0, wUse: [], wTov: [], wAst: [], wReb: [], wStl: [], wBlk: [], wFou: [], tac };

  // Una posesión de O contra D. Devuelve puntos.
  function posesion(O, D, c) {
    const cf = c.cf;

      const si = wp(O.wUse), sh = O.L[si], at = sh.p.att, f = sh.f;
      let p3 = cf.p3 + (at.tiro3 - at.tiro2) / 300;

      const ids = shuffle(liga.equipos.slice());
      const rr = rondasRR(ids);
      let rondas = rr.concat(rr.map(r => r.map(swap)));
      if (liga.formato === 'nba') rondas = rondas.concat(rr.slice(0, 82 - rondas.length).map((r, i) => i % 2 ? r : r.map(swap)));
      st.clasificaciones[comp] = ids.map(id => ({ equipoId: id, pj: 0, g: 0, p: 0, pf: 0, pc: 0 }));
      let count = 0;
      rondas.forEach((games, r) => {
        let d0 = U.addDays(F.ini(y), Math.floor(r * F.paso));
        if (F.snap) while ([0, 6].indexOf(U.weekday(d0)) < 0) d0 = U.addDays(d0, 1);
        games.forEach((g, i) => {
          let d = F.dos && i >= games.length / 2 ? U.addDays(d0, 1) : d0;
          while (ocupado[d + g[0]] || ocupado[d + g[1]]) d = U.addDays(d, 1);
          ocupado[d + g[0]] = ocupado[d + g[1]] = 1;
          creaG(st, comp, 'regular', g[0], g[1], d, r + 1); count++;
        });
      });
      st.pendReg[comp] = count;
    });
    st.calendario.sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
  }

  function ordenar(rows) {
    return rows.slice().sort((a, b) => b.g - a.g || (b.pf - b.pc) - (a.pf - a.pc) || b.pf - a.pf);
  }
  function clasificacion(st, comp, conf) {
    let rows = st.clasificaciones[comp] || [];
    if (conf) rows = rows.filter(r => st.equipos[r.equipoId].conferencia === conf);
    return ordenar(rows);
  }
  function anota(st, g, res) {
    const c = st.clasificaciones[g.comp];
    const a = c.find(r => r.equipoId === g.local), b = c.find(r => r.equipoId === g.visitante);
    a.pj++; b.pj++; a.pf += res.local; a.pc += res.visitante; b.pf += res.visitante; b.pc += res.local;
    if (res.local > res.visitante) { a.g++; b.p++; } else { b.g++; a.p++; }
  }

  // ---------- Playoffs ----------
  function iniciarPO(st, comp) {
    const liga = st.ligas[comp], f = liga.formato, F = FORM[f], y = yearOf(st);
    const tabla = clasificacion(st, comp);
    const rank = {}; tabla.forEach((r, i) => { rank[r.equipoId] = i + 1; });
    const po = { comp, formato: f, rank, fase: 'rondas', rondas: [], ri: -1, campeon: null, playin: null };
    st.playoffs[comp] = po;
    if (f === 'nba' || f === 'euroliga') {
      po.fase = 'playin';
      const confs = f === 'nba' ? ['E', 'O'] : [null];
      po.playin = confs.map(c => {
        const t = clasificacion(st, comp, c).map(r => r.equipoId);
        return { conf: c, directos: t.slice(0, 6), seeds: t.slice(0, 10), g1: null, g2: null, g3: null, s7: null, s8: null };
      });
      st.nPI = F.pi(y);
      GM.noticia(st, (f === 'nba' ? 'NBA' : 'Euroliga') + ': termina la fase regular. ¡Empieza el play-in!');
    } else {
      const n = f === 'acb' ? 8 : 4;
      const seeds = tabla.slice(0, n).map(r => r.equipoId);
      armaR1(st, po, [seeds]);
      GM.noticia(st, liga.nombre + ': termina la fase regular. Arrancan los playoffs.');
    }
  }
  function parejasR1(seeds) {
    if (seeds.length === 8) return [[0, 7], [3, 4], [1, 6], [2, 5]].map(p => [seeds[p[0]], seeds[p[1]]]);
    return [[seeds[0], seeds[3]], [seeds[1], seeds[2]]];

  function armaR1(st, po, listas) {
    const pares = [];
    listas.forEach(s => parejasR1(s).forEach(p => pares.push(p)));

  }
  function crearRonda(st, po, idx, pares) {
    const y = yearOf(st), F = FORM[po.formato], cfg = F.rondas[idx];
    let ini = U.addDays(st.fecha, idx === 0 ? 1 : 2);
    if (idx === 0) ini = mx(ini, F.po(y));
    if (cfg.min) ini = mx(ini, cfg.min(y));
    po.ri = idx; po.fase = 'rondas';
    po.rondas.push({ nombre: cfg.n, mejorDe: cfg.m, series: pares.map((p, i) => {
      const a = po.rank[p[0]] <= po.rank[p[1]] ? p[0] : p[1], b = a === p[0] ? p[1] : p[0];
      return { id: po.comp + '-r' + idx + '-s' + i, a, b, mejorDe: cfg.m, wa: 0, wb: 0, ganador: null, pend: null, last: null, inicio: ini };
    }) });
  }
  function procesaSerie(st, po, s) {
    if (s.ganador) return;
    if (s.pend) {
      const g = getG(st, s.pend);
      if (g && g.resultado) {
        if (ganadorG(g) === s.a) s.wa++; else s.wb++;
        s.pend = null; s.last = g.fecha;
        const need = Math.floor(s.mejorDe / 2) + 1;
        if (s.wa >= need) s.ganador = s.a; else if (s.wb >= need) s.ganador = s.b;
      }
    }
    if (!s.ganador && !s.pend) {
      const n = s.wa + s.wb;
      const host = PATRON[s.mejorDe][n] === 'a' ? s.a : s.b, other = host === s.a ? s.b : s.a;
      const fecha = s.last ? U.addDays(s.last, 2) : mx(s.inicio, U.addDays(st.fecha, 1));
      s.pend = creaG(st, po.comp, 'playoff', host, other, fecha, n + 1, { ronda: po.ri + 1, serie: s.id });

  function procesarPO(st) {
    Object.keys(st.playoffs).forEach(comp => {
      const po = st.playoffs[comp];
      if (po.campeon) return;
      if (po.fase === 'playin') {
        po.playin.forEach(gr => {
          if (!gr.g1) {
            const f = mx(U.addDays(st.fecha, 1), st.nPI);
            gr.g1 = creaG(st, comp, 'playin', gr.seeds[6], gr.seeds[7], f, 1);
            gr.g2 = creaG(st, comp, 'playin', gr.seeds[8], gr.seeds[9], f, 1);
          } else if (!gr.g3) {
            const a = getG(st, gr.g1), b = getG(st, gr.g2);
            if (a.resultado && b.resultado) {

          } else if (!gr.s8) {

        if (po.playin.every(gr => gr.s8)) {

        }
        return;
      }
      const R = po.rondas[po.ri];
      R.series.forEach(s => procesaSerie(st, po, s));
      if (R.series.every(s => s.ganador)) {
        const F = FORM[po.formato];
        if (po.ri >= F.rondas.length - 1) {
          po.campeon = R.series[0].ganador;
          const liga = st.ligas[po.comp];
          st.historial.push({ temporada: st.temporada, comp: po.comp, campeon: po.campeon });
          GM.noticia(st, '🏆 ' + st.equipos[po.campeon].nombre + ' campeón de ' + liga.nombre + '.');
        } else {
          const w = R.series.map(s => s.ganador), pares = [];
          for (let i = 0; i < w.length; i += 2) pares.push([w[i], w[i + 1]]);
          crearRonda(st, po, po.ri + 1, pares);

    });
  }

  // ---------- Día a día ----------
  function jugarDia(st) {
    const hoy = st.fecha;
    const juegos = st.calendario.filter(g => g.fecha === hoy && !g.resultado);
    const P = GM.mods.partidos;
    juegos.forEach(g => {
      const sim = (st._directo && st._directo[g.id]) || P.simular(st, g);
      if (st._directo) delete st._directo[g.id];
      const mio = g.local === st.clubId || g.visitante === st.clubId;
      g.resultado = mio ? sim : { local: sim.local, visitante: sim.visitante, ot: sim.ot, cuartos: sim.cuartos };
      for (const pid in sim.stats) {
        const s = sim.stats[pid], t = st.estadisticas[pid] || (st.estadisticas[pid] = { pj: 0, min: 0, pts: 0, reb: 0, ast: 0, stl: 0, blk: 0, tov: 0, fal: 0 });
        t.pj++; t.min += s.min; t.pts += s.pts; t.reb += s.reb; t.ast += s.ast; t.stl += s.stl; t.blk += s.blk; t.tov += s.tov; t.fal += s.fal;

      if (g.fase === 'regular') { anota(st, g, sim); st.pendReg[g.comp]--; }
      GM.bus.emit('partido:jugado', { partido: g });

    Object.keys(st.pendReg).forEach(c => { if (st.pendReg[c] === 0 && !st.playoffs[c]) iniciarPO(st, c); });
    procesarPO(st);
    st.fecha = U.addDays(hoy, 1);
    GM.bus.emit('dia:avanzado', { fecha: st.fecha });
    if (!st.temporadaTerminada && Object.keys(st.playoffs).length && Object.keys(st.ligas).every(c => !FORM[st.ligas[c].formato] || (st.playoffs[c] && st.playoffs[c].campeon))) finTemporada(st);
    return juegos;
  }
  function proximoPartido(st, clubId) {
    let best = null;
    for (const g of st.calendario) {
      if (g.resultado || g.fecha < st.fecha) continue;
      if (g.local !== clubId && g.visitante !== clubId) continue;
      if (!best || g.fecha < best.fecha) best = g;

    return best;
  }
  function avanzarHastaPartido(st, clubId, max) {
    let n = 0; max = max || 400;
    while (n < max) {

      if (p && p.fecha <= st.fecha) break;
      if (!p && st.temporadaTerminada) break;
      jugarDia(st); n++;
      if (st.temporadaTerminada) break;
    }
    return n;
  }
  function calendarioClub(st, clubId) {
    return st.calendario.filter(g => g.local === clubId || g.visitante === clubId).sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
  }
  function playoffs(st, comp) { return st.playoffs[comp] || null; }
  function finTemporada(st) {

  }
  function nuevaTemporada(st) {

  }
  function nuevaPartida(st) { st.estadisticas = {}; generarCalendario(st); }

  function selfTest() {
    if (!GM.mkJugador || !GM.mods.partidos) return false;
    const st = { clubId: 'x', temporada: '2026-27', fecha: '2026-09-24', noticias: [], historial: [], estadisticas: {}, equipos: {}, jugadores: {}, ligas: {} };
    const ids = ['t1', 't2', 't3', 't4', 't5', 't6'];
    ids.forEach((id, k) => {
      const pl = [];
      ['PG', 'SG', 'SF', 'PF', 'C', 'PG', 'SG', 'SF'].forEach((pos, i) => { const j = GM.mkJugador(id, i + 1, id + i, pos, 26, 200, 'ES', 'UE', 70 + k - i, 70, 'E', 1e6, 2027); st.jugadores[j.id] = j; pl.push(j.id); });
      st.equipos[id] = { id, nombre: id, plantilla: pl };
    });
    st.ligas.L = { id: 'L', nombre: 'Liga de prueba', formato: 'liga_simple', equipos: ids };
    GM.rng.seed(7);
    generarCalendario(st);
    let guard = 0;
    while (!st.temporadaTerminada && guard++ < 500) jugarDia(st);
    const rows = clasificacion(st, 'L');
    return st.temporadaTerminada && rows.every(r => r.pj === 10) && !!st.playoffs.L.campeon;
  }

  GM.register('competiciones', { generarCalendario, proximoPartido, clasificacion, playoffs, jugarDia, avanzarHastaPartido, calendarioClub, finTemporada, nuevaTemporada, nuevaPartida, selfTest, FORM });
})();

/* ===== mercado ===== */
/* PLANTILLA Y MERCADO (GM.mods.mercado)
   Expone: valorJugador, salarioPedido, topeSalarial, evaluarOferta, ofertar, renovar, liberar, precioMinimo, comprar,
   ofertasVenta, vender, traspasar, draft, expiran, libres, buscar, selfTest.
   Escribe state.mercado = { libres, seq, ultimoDraft }. NBA: tope blando (140 M€); resto: límite de masa salarial según reputación.
   La IA mueve el mercado en dia:avanzado; en temporada:fin hace el draft y caducan contratos. */
(function () {
  const U = GM.util;
  const yearOf = st => parseInt(st.temporada.slice(0, 4), 10);
  const PRIO = ['NBA', 'EUROLIGA', 'ACB', 'LEGA', 'GBL', 'BBL', 'BSL'];
  const FACT = { NBA: 1, EUROLIGA: 0.18, ACB: 0.07, LEGA: 0.06, GBL: 0.06, BBL: 0.07, BSL: 0.08 };
  const MINSAL = { NBA: 2.2e6, EUROLIGA: 0.2e6, ACB: 0.1e6, LEGA: 0.1e6, GBL: 0.1e6, BBL: 0.1e6, BSL: 0.1e6 };
  const TOPE_NBA = 140e6, TECHO_NBA = 190e6, MAXP = 15;
  const POS = ['PG', 'SG', 'SF', 'PF', 'C'];
  const F = () => GM.mods.finanzas;

  function ligaDe(st, eqId) { return PRIO.find(l => st.ligas[l] && st.ligas[l].equipos.indexOf(eqId) >= 0) || 'LEGA'; }
  function valorJugador(p) {
    let v = Math.pow(Math.max(0, p.ovr - 42) / 50, 3.6) * 58e6;
    if (p.edad <= 22) v *= 1 + Math.max(0, p.pot - p.ovr) * 0.03;
    if (p.edad >= 31) v *= Math.max(0.3, 1 - 0.06 * (p.edad - 30));
    return Math.round(v + 100000);
  }
  function salarioPedido(st, jugId, eqId) {
    const p = st.jugadores[jugId], l = ligaDe(st, eqId);
    const s = valorJugador(p) * FACT[l] * (0.9 + (U.hash(jugId) % 21) / 100);
    return Math.max(MINSAL[l], Math.round(s / 10000) * 10000);
  }
  const masaMax = (st, eqId) => Math.round(2e6 + Math.pow(st.equipos[eqId].reputacion / 100, 3) * 60e6);
  function masa(st, eqId) { return F() ? F().masaSalarial(st, eqId) : st.equipos[eqId].plantilla.reduce((a, i) => a + st.jugadores[i].contrato.salario, 0); }
  function topeSalarial(st, eqId) {
    const l = ligaDe(st, eqId), m = masa(st, eqId);
    if (l === 'NBA') return { tope: TOPE_NBA, techo: TECHO_NBA, masa: m, margen: TOPE_NBA - m, tipo: 'Tope blando de la NBA' };
    const t = masaMax(st, eqId);
    return { tope: t, techo: t, masa: m, margen: t - m, tipo: 'Límite salarial del club' };
  }
  function motivoNoAnadir(st, eqId, salario, via, antiguo) {
    const l = ligaDe(st, eqId), m = masa(st, eqId) - (antiguo || 0);
    if (via !== 'renovar' && st.equipos[eqId].plantilla.length >= MAXP) return 'Plantilla completa (' + MAXP + ' jugadores).';
    if (l === 'NBA') {
      if (via === 'renovar') return m + salario > TECHO_NBA ? 'Superarías el techo salarial de 190 M€.' : null;
      if (salario <= MINSAL.NBA * 1.02) return null;
      return m + salario > TOPE_NBA ? 'No hay espacio bajo el tope salarial (' + U.eur(TOPE_NBA) + ').' : null;
    }
    return m + salario > masaMax(st, eqId) ? 'Supera el límite salarial del club (' + U.eur(masaMax(st, eqId)) + ').' : null;
  }
  const nl = (st, id) => st.equipos[id].plantilla.length;

  function evaluarOferta(st, jugId, eqId, salario, anos, renov) {
    const p = st.jugadores[jugId], eq = st.equipos[eqId];
    const ask = salarioPedido(st, jugId, eqId) * (renov ? 1.04 : 1);
    const ratio = salario / ask;
    let prob = ratio >= 1 ? 1 : ratio < 0.8 ? 0 : (ratio - 0.8) / 0.2 * 0.85 + (eq.reputacion - 60) / 300;
    if (p.edad >= 32 && anos >= 3) prob -= 0.1;
    if (p.edad <= 23 && anos === 1) prob -= 0.1;
    if (renov) prob += (p.estado.moral - 60) / 300;
    return { pedido: Math.round(ask / 10000) * 10000, prob: U.clamp(prob, 0, 1) };
  }
  function ficha(st, p, eqId, salario, anos) {
    st.mercado.libres = st.mercado.libres.filter(i => i !== p.id);
    p.libre = false; p.equipoId = eqId;
    p.contrato = { salario, hasta: yearOf(st) + anos };
    if (st.equipos[eqId].plantilla.indexOf(p.id) < 0) st.equipos[eqId].plantilla.push(p.id);
  }
  function ofertar(st, jugId, o) {
    const p = st.jugadores[jugId], club = st.clubId;
    if (!p) return { ok: false, motivo: 'Jugador desconocido.' };
    if (!p.libre) return { ok: false, motivo: 'Tiene contrato con otro club: negocia un traspaso.' };
    const salario = Math.round(o.salario), anos = U.clamp(o.anos || 1, 1, 4);
    if (p.origen === 'NBA' && ligaDe(st, club) !== 'NBA' && p.ovr > 72) return { ok: false, motivo: 'Prefiere seguir en la NBA.' };
    const nope = motivoNoAnadir(st, club, salario, 'fichaje');
    if (nope) return { ok: false, motivo: nope };
    const ev = evaluarOferta(st, jugId, club, salario, anos, false);
    if (GM.rng.next() > ev.prob) return { ok: false, motivo: ev.prob === 0 ? 'Quiere bastante más: pide unos ' + U.eur(ev.pedido) + ' al año.' : 'Prefiere esperar otras ofertas. Mejora el salario.' };
    ficha(st, p, club, salario, anos);
    GM.noticia(st, 'Fichaje: ' + p.nombre + ' (' + p.ovr + ') firma por ' + anos + (anos === 1 ? ' temporada.' : ' temporadas.'));
    GM.bus.emit('fichaje:hecho', { jugadorId: p.id, de: null, a: club });

  }
  function renovar(st, jugId, o) {
    const p = st.jugadores[jugId], club = st.clubId;

    const salario = Math.round(o.salario), anos = U.clamp(o.anos || 1, 1, 4);
    const nope = motivoNoAnadir(st, club, salario, 'renovar', p.contrato.salario);
    if (nope) return { ok: false, motivo: nope };
    const ev = evaluarOferta(st, jugId, club, salario, anos, true);
    if (GM.rng.next() > ev.prob) return { ok: false, motivo: 'No acepta. Pide unos ' + U.eur(ev.pedido) + ' al año.' };
    p.contrato = { salario, hasta: Math.max(p.contrato.hasta, yearOf(st) + 1) + anos };
    p.estado.moral = U.clamp(p.estado.moral + 8, 0, 100);

    return { ok: true };
  }
  function liberar(st, jugId) {
    const p = st.jugadores[jugId], club = st.clubId;
    if (!p || p.equipoId !== club) return { ok: false, motivo: 'No es de tu plantilla.' };
    if (nl(st, club) <= 10) return { ok: false, motivo: 'Necesitas al menos 10 jugadores.' };
    const quedan = Math.max(0, p.contrato.hasta - yearOf(st));
    const coste = Math.min(p.contrato.salario * 2, Math.round(p.contrato.salario * 0.5 * quedan));
    if (coste && F()) F().registrar(st, club, 'Indemnización a ' + p.nombre, -coste);
    sacar(st, p);
    GM.noticia(st, p.nombre + ' deja el club.');
    return { ok: true, coste };
  }
  function sacar(st, p) {
    if (p.equipoId) p.origen = ligaDe(st, p.equipoId);
    const eq = st.equipos[p.equipoId];
    if (eq) eq.plantilla = eq.plantilla.filter(i => i !== p.id);
    p.equipoId = null; p.libre = true;
    p.contrato = { salario: 0, hasta: 0 };
    if (st.mercado.libres.indexOf(p.id) < 0) st.mercado.libres.push(p.id);
  }

  // ----- Traspasos -----
  function precioMinimo(st, jugId) {
    const p = st.jugadores[jugId]; if (!p.equipoId) return 0;
    const l = ligaDe(st, p.equipoId), anos = Math.max(1, p.contrato.hasta - yearOf(st));
    return Math.max(50000, Math.round(valorJugador(p) * FACT[l] * 1.25 * (0.6 + 0.2 * Math.min(anos, 3)) / 50000) * 50000);
  }
  function valorIA(st, jugId, compradorId) {
    const p = st.jugadores[jugId], lv = ligaDe(st, p.equipoId), lc = ligaDe(st, compradorId);
    return Math.max(50000, Math.round(precioMinimo(st, jugId) * 0.95 * U.clamp(FACT[lc] / FACT[lv], 0.4, 1.6) / 50000) * 50000);
  }
  function top2(st, eqId, jugId) {
    return st.equipos[eqId].plantilla.map(i => st.jugadores[i]).sort((a, b) => b.ovr - a.ovr).slice(0, 2).some(p => p.id === jugId);
  }
  function mover(st, p, aId, precio) {
    const de = p.equipoId;
    st.equipos[de].plantilla = st.equipos[de].plantilla.filter(i => i !== p.id);
    st.equipos[aId].plantilla.push(p.id); p.equipoId = aId;
    if (F()) {

/* ===== cantera ===== */
/* CANTERA Y ENTRENAMIENTO (GM.mods.cantera)
   Expone: generarJuveniles, ojear, ficharJuvenil, subirAlPrimerEquipo, soltarJuvenil, fijarFoco, progresionDiaria, progresionAnual, selfTest.
   Escribe state.cantera[clubId] = { juveniles, prospectos, foco, scouts }. Solo el club del jugador tiene juveniles.

(function () {
  const U = GM.util;

  const yearOf = st => parseInt(st.temporada.slice(0, 4), 10);
  const eff = (st, id) => GM.mods.ciudadDeportiva && GM.mods.ciudadDeportiva.efectos ? GM.mods.ciudadDeportiva.efectos(st, id) : { entrenamiento: 1, cantera: 1 };
  const ciu = (st, id) => GM.mods.ciudad ? GM.mods.ciudad.modificadores(st, id).cantera : 1;

  function nuevoJuvenil(st, clubId, pais, calidad) {
    const c = st.cantera[clubId]; c.seq = (c.seq || 0) + 1;
    const h = U.hash(clubId + st.temporada + c.seq), pos = POS[h % 5], pa = pais || (h % 3 ? st.equipos[clubId].pais : 'GEN');
    const ovr = Math.round(U.clamp(40 + calidad * 10 + (h % 7) - 3, 36, 56)), pot = Math.round(U.clamp(ovr + 8 + calidad * 14 + (h >>> 4) % 9, 55, 90));
    const nac = pa === 'GEN' ? 'PL' : pa;
    const p = GM.mkJugador('jv', c.seq, GM.nombreAleatorio(pa, h), pos, 16 + (h >>> 6) % 4, GM.alturaPos(pos, h), nac, GM.pasaporte(nac), ovr, pot, ['T', 'P', 'D', 'R', 'E'][(h >>> 8) % 5], Math.round(40000 + ovr * 1500), yearOf(st) + 3);

    for (let i = 0; i < (n === undefined ? 6 : n); i++) c.juveniles.push(nuevoJuvenil(st, clubId, null, 0.5 + q + GM.rng.next() * 0.5).id);

    if (!ZONAS[zona]) return { ok: false, motivo: 'Zona desconocida.' };

    if (F) F.registrar(st, clubId, 'Ojeo en ' + zona, -coste);

    c.prospectos = [];
    const base = 0.4 + (c.scouts[0].nivel - 1) * 0.2 + eff(st, clubId).cantera - 1;
    for (let i = 0; i < 3; i++) {
      const p = nuevoJuvenil(st, clubId, ZONAS[zona], base + GM.rng.next() * 0.9);
      p.equipoId = null; p.prospecto = true;
      c.prospectos.push(p.id);

  }
  function ficharJuvenil(st, clubId, jugId) {
    const c = st.cantera[clubId], p = st.jugadores[jugId];
    if (c.prospectos.indexOf(jugId) < 0) return { ok: false, motivo: 'Ese prospecto ya no está disponible.' };

    c.juveniles = c.juveniles.filter(i => i !== jugId);
    p.juvenil = false; p.contrato = { salario: Math.max(120000, Math.round(p.ovr * 4000)), hasta: yearOf(st) + 3 };

  }
  function progresionDiaria(st) {

    });
  }
  GM.bus.on('dia:avanzado', function () {

  function progresionAnual(st) {

      else if (p.edad <= 28) d = GM.rng.int(-1, 1); else if (p.edad <= 31) d = GM.rng.int(-2, 0); else d = GM.rng.int(-4, -1);

/* ===== copas ===== */
/* COPAS (GM.mods.copas)
   Cada liga nacional tiene su copa de eliminatoria única entre los 8 mejores clasificados en la fecha de la competición:
   Copa del Rey (ACB), NBA Cup, Copa de Grecia, BBL-Pokal, Coppa Italia y Copa de Turquía. Cuartos, semifinales y final con el mejor clasificado como local.
   Expone: estado, copa, partidosClub, selfTest. Escribe state.copas[id] = { nombre, liga, estado, rondas:[{nombre,partidos:[ids]}], campeon }.

(function () {
  const U = GM.util;

  const DEF = {
    COPA_REY: { liga: 'ACB', nombre: 'Copa del Rey', fecha: y => (y + 1) + '-02-11', min: 14 },
    NBA_CUP: { liga: 'NBA', nombre: 'NBA Cup', fecha: y => y + '-12-02', min: 20 },
    COPA_GRECIA: { liga: 'GBL', nombre: 'Copa de Grecia', fecha: y => (y + 1) + '-02-20', min: 14 },
    POKAL: { liga: 'BBL', nombre: 'BBL-Pokal', fecha: y => (y + 1) + '-02-18', min: 14 },
    COPPA_ITALIA: { liga: 'LEGA', nombre: 'Coppa Italia', fecha: y => (y + 1) + '-02-16', min: 12 },
    COPA_TURQUIA: { liga: 'BSL', nombre: 'Copa de Turquía', fecha: y => (y + 1) + '-02-25', min: 14 }
  };
  const RONDAS = ['Cuartos de final', 'Semifinales', 'Final'];
  const getG = (st, id) => st.calendario.find(g => g.id === id);
  const ocupado = (st, d, a, b) => st.calendario.some(g => g.fecha === d && (g.local === a || g.visitante === a || g.local === b || g.visitante === b));
  function libre(st, d, a, b) { let k = 0; while (ocupado(st, d, a, b) && k++ < 40) d = U.addDays(d, 1); return d; }

  function iniciar(st) {
    st.copas = {};
    Object.keys(DEF).forEach(id => { if (st.ligas[DEF[id].liga]) st.copas[id] = { nombre: DEF[id].nombre, liga: DEF[id].liga, estado: 'pendiente', fecha: DEF[id].fecha(yearOf(st)), rondas: [], campeon: null }; });
  }
  function crearRonda(st, c, idx, pares, desde) {

      const gan = gs.map(ganador), ult = gs.reduce((m, g) => g.fecha > m ? g.fecha : m, gs[0].fecha);
      if (gan.length === 1) {
        c.campeon = gan[0]; c.estado = 'fin';
        st.historial.push({ temporada: st.temporada, comp: id, campeon: c.campeon });
        GM.noticia(st, '🏆 ' + st.equipos[c.campeon].nombre + ' gana la ' + c.nombre + '.');

  function estado(st) { return st.copas || {}; }
  function copa(st, id) {
    const c = st.copas[id]; if (!c) return null;
    return Object.assign({ id }, c, { rondas: c.rondas.map(r => ({ nombre: r.nombre, partidos: r.partidos.map(i => getG(st, i)).filter(Boolean) })) });
  }

    return st.calendario.length === 4 && st.calendario.every(g => g.fase === 'copa') && c.rondas[0].nombre === 'Cuartos de final' && ganador({ local: 'x', visitante: 'y', resultado: { local: 80, visitante: 70 } }) === 'x';
  }

/* ===== continental ===== */
/* COMPETICIONES CONTINENTALES (GM.mods.continental)
   EuroCup y Basketball Champions League para los clubes que no están en la Euroliga, por reputación. Cada una tiene:
   fase previa (eliminatorias a doble partido), fase de grupos (ida y vuelta), eliminatorias a doble partido y final a partido único.
   Expone: estado, competicion, tablaGrupo, de(st, clubId), selfTest. Escribe state.continental[id] = { nombre, estado, participantes, previa, grupos, ko, campeon }.
   Los partidos son entradas del calendario con fase 'continental' (no puntúan en las ligas). El campeón se añade a state.historial. */
(function () {
  const U = GM.util;
  const yearOf = st => parseInt(st.temporada.slice(0, 4), 10);
  const DEF = {
    EUROCUP: { nombre: 'EuroCup', directos: 16, previa: 8, tam: 5, ko: ['Cuartos de final', 'Semifinales', 'Final'], j0: m => m + '-20', salto: 14 },
    BCL: { nombre: 'Basketball Champions League', directos: 24, previa: 16, tam: 4, ko: ['Octavos de final', 'Cuartos de final', 'Semifinales', 'Final'], j0: m => m + '-27', salto: 14 }
  };
  const getG = (st, id) => st.calendario.find(g => g.id === id);
  const ocupado = (st, d, a, b) => st.calendario.some(g => g.fecha === d && (g.local === a || g.visitante === a || g.local === b || g.visitante === b));
  function libre(st, d, a, b) { let k = 0; while (ocupado(st, d, a, b) && k++ < 6) d = U.addDays(d, 1); return d; }
  function juego(st, id, c, ronda, local, vis, fecha, extra) {
    const g = Object.assign({ id: 'g' + (++st.seq), fecha: libre(st, fecha, local, vis), comp: id, fase: 'continental', cont: id, ronda, jornada: 0, local, visitante: vis, resultado: null }, extra || {});
    st.calendario.push(g); return g.id;
  }
  function participantes(st) {
    const euro = new Set(st.ligas.EUROLIGA ? st.ligas.EUROLIGA.equipos : []);
    const pool = Object.keys(st.equipos).filter(id => !euro.has(id) && Object.keys(st.ligas).some(l => l !== 'NBA' && l !== 'EUROLIGA' && st.ligas[l].equipos.indexOf(id) >= 0)).sort((a, b) => st.equipos[b].reputacion - st.equipos[a].reputacion);
    const ec = pool.slice(0, 24), resto = pool.slice(24);
    const previaN = Math.min(16, Math.max(0, (resto.length - 16) - ((resto.length - 16) % 2)));
    return { EUROCUP: { directos: ec.slice(0, 16), previa: ec.slice(16, 24) }, BCL: { directos: resto.slice(0, resto.length - previaN), previa: resto.slice(resto.length - previaN) } };
  }
  function iniciar(st) {
    st.continental = {}; const P = participantes(st);
    Object.keys(DEF).forEach(id => { const p = P[id]; if (p.directos.length < 8) return; st.continental[id] = { id, nombre: DEF[id].nombre, estado: 'pendiente', directos: p.directos, pre: p.previa, previa: [], grupos: [], ko: [], campeon: null, y: yearOf(st) }; });
  }
  const sem = (d0, n) => U.addDays(d0, n);
  function empezarPrevia(st, c) {
    const y = yearOf(st), base = DEF[c.id] && (c.id === 'EUROCUP' ? y + '-09-29' : y + '-09-30'), pre = c.pre.slice().sort((a, b) => st.equipos[b].reputacion - st.equipos[a].reputacion), n = pre.length / 2;
    c.previa = [];
    for (let i = 0; i < n; i++) { const a = pre[i], b = pre[pre.length - 1 - i]; c.previa.push({ a, b, g: [juego(st, c.id, c, 'Previa', b, a, base, { pierna: 1 }), juego(st, c.id, c, 'Previa', a, b, sem(base, 7), { pierna: 2 })], ganador: null }); }
    c.estado = 'previa'; if (!n) pasarAGrupos(st, c);

  }
  function ganadorSerie(st, a, b, ids) {
    const gs = ids.map(i => getG(st, i)); let pa = 0, pb = 0;
    gs.forEach(g => { const sa = g.local === a ? g.resultado.local : g.resultado.visitante, sb = g.local === a ? g.resultado.visitante : g.resultado.local; pa += sa; pb += sb; });
    if (pa !== pb) return pa > pb ? a : b;
    return st.equipos[a].reputacion >= st.equipos[b].reputacion ? a : b;
  }
  function serieLista(st, ids) { return ids.every(i => { const g = getG(st, i); return g && g.resultado; }); }
  function pasarAGrupos(st, c) {
    const y = yearOf(st), tam = DEF[c.id].tam, lista = c.directos.concat(c.previa.map(s => s.ganador)).filter(Boolean);
    let ng = 1; while (ng * 2 * tam <= lista.length) ng *= 2; const T = ng * tam, eq = lista.sort((a, b) => st.equipos[b].reputacion - st.equipos[a].reputacion).slice(0, T);
    c.koNombres = ['Octavos de final', 'Cuartos de final', 'Semifinales', 'Final'].slice(-Math.round(Math.log2(ng * 2)));
    const G = Array.from({ length: ng }, () => []);
    eq.forEach((id, i) => { const fila = Math.floor(i / ng); G[fila % 2 === 0 ? i % ng : ng - 1 - (i % ng)].push(id); });
    const d0 = y + (c.id === 'EUROCUP' ? '-10-20' : '-10-27');
    c.grupos = G.map((equipos, gi) => {
      const rondas = rr(equipos), jornadas = rondas.length * 2;
      const ids = [];
      rondas.concat(rondas.map(r => r.map(m => [m[1], m[0]]))).forEach((partidos, k) => partidos.forEach(m => ids.push(juego(st, c.id, c, 'Grupo ' + 'ABCDEFGH'[gi], m[0], m[1], sem(d0, k * DEF[c.id].salto), { jornada: k + 1, grupo: gi }))));
      return { equipos, ids };
    });
    c.estado = 'grupos'; GM.noticia(st, c.nombre + ': empieza la fase de grupos (' + ng + ' grupos).');
  }
  function rr(ids) {
    const t = ids.slice(); if (t.length % 2) t.push(null); const n = t.length, rs = [];
    for (let r = 0; r < n - 1; r++) { const m = []; for (let i = 0; i < n / 2; i++) { const a = t[i], b = t[n - 1 - i]; if (a && b) m.push((r + i) % 2 === 0 ? [a, b] : [b, a]); } rs.push(m); t.splice(1, 0, t.pop()); }
    return rs;
  }
  function tablaGrupo(st, id, gi) {
    const c = st.continental[id], g = c.grupos[gi], fila = {}; g.equipos.forEach(e => { fila[e] = { equipoId: e, pj: 0, g: 0, p: 0, pf: 0, pc: 0 }; });
    g.ids.map(i => getG(st, i)).filter(x => x && x.resultado).forEach(x => { const a = fila[x.local], b = fila[x.visitante], r = x.resultado; a.pj++; b.pj++; a.pf += r.local; a.pc += r.visitante; b.pf += r.visitante; b.pc += r.local; if (r.local > r.visitante) { a.g++; b.p++; } else { b.g++; a.p++; } });
    return Object.keys(fila).map(k => fila[k]).sort((x, y) => y.g - x.g || (y.pf - y.pc) - (x.pf - x.pc) || st.equipos[y.equipoId].reputacion - st.equipos[x.equipoId].reputacion);
  }
  function crearKO(st, c, idx, pares, desde) {
    const ult = idx === c.koNombres.length - 1, d0 = sem(desde, 14), nom = c.koNombres[idx];
    const eliminatorias = pares.map(p => { const ids = ult ? [juego(st, c.id, c, nom, p[0], p[1], d0, { pierna: 1 })] : [juego(st, c.id, c, nom, p[1], p[0], d0, { pierna: 1 }), juego(st, c.id, c, nom, p[0], p[1], sem(d0, 7), { pierna: 2 })]; return { a: p[0], b: p[1], g: ids, ganador: null }; });
    c.ko.push({ nombre: nom, series: eliminatorias });
  }
  GM.bus.on('dia:avanzado', function () {
    const st = GM.state; if (!st || !st.continental) return;
    Object.keys(st.continental).forEach(id => {
      const c = st.continental[id]; if (c.estado === 'fin') return;
      if (c.estado === 'pendiente') { if (st.fecha >= yearOf(st) + '-09-26') empezarPrevia(st, c); return; }
      if (c.estado === 'previa') {
        c.previa.forEach(s => { if (!s.ganador && serieLista(st, s.g)) s.ganador = ganadorSerie(st, s.a, s.b, s.g); });
        if (c.previa.every(s => s.ganador)) pasarAGrupos(st, c); return;
      }
